# 版本声明
version: "3.8"

services:
  # 服务1
  ticket:
    image: ticket_project:latest # 使用的镜像
    container_name: ticket # 容器名（可选）
    ports:
      - "8080:8080" # 宿主机端口:容器端口
    networks:
      - my-net # 加入自定义网桥
    depends_on: # 添加依赖控制启动顺序
      - mysql
      - redis
    # -it 启动
    stdin_open: true
    tty: true

  # 服务2
  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment: # 环境变量
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: "go_ticket" # 自动创建数据库
    networks:
      - my-net

  # 服务3
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - my-net

  # 服务4
  nginx:
    image: nginx:latest
    ports:
      - "81:80"
    volumes: # 挂载
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - my-net
    depends_on:
      - ticket
    restart: always

# 自定义网桥（自动创建）
networks:
  my-net:
    driver: bridge